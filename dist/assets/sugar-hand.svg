   <path d="M86 187 C94 176 106 177 116 188 C125 199 130 211 135 220 C139 228 150 234 155 242 C161 250 158 261 151 266 C145 270 137 267 133 261 C129 255 128 249 123 245 C115 239 109 232 105 221 L93 201Z" fill="url(#finger)" stroke="#b87b59" stroke-width="1.1"/>
