  </g>
  <path d="M72 152 Q96 160 125 153 M74 158 Q93 164 112 162" fill="none" stroke="#b78060" stroke-opacity=".32" stroke-width="1"/>
  <path d="M80 12 C81 66 84 113 78 142" fill="none" stroke="#ffdcba" stroke-opacity=".2" stroke-width="8"/>
