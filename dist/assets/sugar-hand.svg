   <path d="M63 190 C72 182 82 188 89 201 C95 213 102 223 114 232 C125 240 139 244 143 253 C147 260 143 268 136 269 C125 269 121 259 114 255 L90 243 C76 237 65 227 60 213 C57 203 58 196 63 190Z" fill="url(#thumb)"/>
